<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Conversion Arrows / Loops Ring -->
  <g transform="translate(256, 256)">
    <!-- Top-Right Arrow (Cyan) -->
    <path d="M -100,-40 A 110,110 0 0,1 110,-10 L 110,-45 M 110,-10 L 65,-10" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom-Left Arrow (Emerald) -->
    <path d="M 100,40 A 110,110 0 0,1 -110,10 L -110,45 M -110,10 L -65,10" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Spark / Diamond Core -->
    <path d="M 0,-32 L 20,0 L 0,32 L -20,0 Z" fill="#38bdf8" filter="url(#glow)" />
  </g>
</svg>